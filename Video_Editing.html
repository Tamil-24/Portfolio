<form class="project-enquiry-form"
      action="https://formsubmit.co/hustler.0245@gmail.com"
      method="POST">

    <input type="hidden" name="_subject"
           value="New Project Enquiry - Portfolio">

    <input type="hidden" name="_template" value="table">

    <!-- Customer name -->
    <input type="text"
           name="Customer Name"
           placeholder="Your Name"
           required>

    <!-- Customer email -->
    <input type="email"
           name="email"
           placeholder="Your Email Address"
           required>

    <!-- Working or reference link -->
    <input type="url"
           name="Reference Link"
           placeholder="Project / Reference Link (https://...)"
           required>

    <!-- Project explanation -->
    <textarea name="Project Details"
              placeholder="Tell me about your project..."
              rows="3"
              required></textarea>

    <button type="submit">Submit Enquiry</button>

</form>
